name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch. When several PRs are merged in a row, their builds queue
# instead of publishing at once (two at once can delete each other's player file).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build both apps
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then echo "::notice::TMDB key found"; else echo "::warning::TMDB_API_KEY secret is missing, so the film carousel will be empty"; fi
          chmod +x gradlew
          # On failure, repeat the compiler's errors as annotations, so they can be read without the full log.
          set +e
          ./gradlew :app:assembleRelease :player:assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # GitHub keeps only a few annotations per step, so the errors go in one, line breaks encoded.
            errors=$( (grep -E "^e: " build.log; grep -A4 "What went wrong" build.log) | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build failed::$errors"
            exit "$status"
          fi
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk
          cp player/build/outputs/apk/release/player-release.apk wiptv-player.apk
          # The update pill reads these instead of GitHub's API, which allows only 60 checks an hour.
          echo "${{ github.run_number }}" > tv-launcher.build.txt
          echo "${{ github.run_number }}" > wiptv-player.build.txt

      - name: Keep the app files with this run
        uses: actions/upload-artifact@v5
        with:
          name: apps
          path: |
            tv-launcher.apk
            wiptv-player.apk

      # Only merged changes on main become a release, with a download link that never changes:
      # https://github.com/<owner>/tv-launcher/releases/latest/download/tv-launcher.apk
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Launcher build ${{ github.run_number }}
          files: tv-launcher.apk
          make_latest: "true"

      # The player has a single release, tagged "player", replaced on every merge, so its link
      # never changes either and it never becomes the "latest" release the launcher looks at:
      # https://github.com/<owner>/tv-launcher/releases/download/player/wiptv-player.apk
      - name: Publish player release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: player
          name: WIPTV Player build ${{ github.run_number }}
          body: The IPTV player. Install with Downloader, then it updates itself from the pill in the corner.
          files: wiptv-player.apk
          overwrite_files: true
          make_latest: "false"

      # Each build number goes up only after its app is uploaded, so the pill never finds a
      # number whose app isn't there yet.
      - name: Publish build numbers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Launcher build ${{ github.run_number }}
          files: tv-launcher.build.txt
          make_latest: "true"

      - name: Publish player build number
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: player
          name: WIPTV Player build ${{ github.run_number }}
          body: The IPTV player. Install with Downloader, then it updates itself from the pill in the corner.
          files: wiptv-player.build.txt
          overwrite_files: true
          make_latest: "false"

name: Screenshots

# Native screenshots of the player against a pretend provider with invented titles and artwork,
# taken on an Android emulator at the Fire Stick's 1080p TV size. Pushed to a branch named
# screenshots/<PR branch> so they can be viewed (and linked from the PR).
on:
  pull_request:
    paths:
      - "player/**"
      - "design/**"
      - "tools/screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the debug player
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :player:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            errors=$( (grep -E "^e: " build.log; grep -A4 "What went wrong" build.log) | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build failed::$errors"
            exit "$status"
          fi

      - name: Start the pretend provider
        run: |
          pip install --quiet pillow
          python3 tools/screenshots/make_art.py demo-www
          nohup python3 tools/screenshots/server.py 8000 demo-www > server.log 2>&1 &
          sleep 2
          curl -sf "http://127.0.0.1:8000/player_api.php?username=demo&password=demo" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/screenshots/capture.sh

      - name: Publish screenshots
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: screenshots/${{ github.head_ref || github.ref_name }}
        run: |
          [ -d shots ] || exit 0
          cp server.log shots/ || true
          cd shots
          git init -q -b main
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "::notice title=Screenshots::https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH}"
